<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d9488">
<title>微步 HabitStep</title>
<style>
:root{
  --bg:#fafaf9;--card:#fff;--border:#e7e5e4;--text:#292524;--muted:#78716c;
  --light:#a8a29e;--primary:#0d9488;--primary-d:#0f766e;--primary-l:#ccfbf1;
  --primary-t:#115e59;--amber:#d97706;--amber-bg:#fffbeb;--amber-border:#fde68a;
  --amber-text:#92400e;--danger:#dc2626;--danger-bg:#fef2f2;
  --st-50:#fafaf9;--st-100:#f5f5f4;--st-200:#e7e5e4;--st-300:#d6d3d1;
  --st-400:#a8a29e;--st-500:#78716c;--st-600:#57534e;--st-700:#44403c;
  --st-800:#292524;--st-900:#1c1917;
}
body.dark{
  --bg:#0c0a09;--card:#1c1917;--border:#292524;--text:#e7e5e4;--muted:#a8a29e;
  --light:#78716c;--primary:#2dd4bf;--primary-d:#5eead4;--primary-l:#042f2e;
  --primary-t:#5eead4;--amber:#fbbf24;--amber-bg:rgba(120,53,15,.3);
  --amber-border:rgba(180,83,9,.5);--amber-text:#fcd34d;--danger:#f87171;--danger-bg:rgba(127,29,29,.3);
  --st-50:#0c0a09;--st-100:#1c1917;--st-200:#292524;--st-300:#44403c;
  --st-400:#57534e;--st-500:#78716c;--st-600:#a8a29e;--st-700:#d6d3d1;
  --st-800:#e7e5e4;--st-900:#f5f5f4;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;
  transition:background .2s,color .2s;font-size:14px}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
  background:var(--bg);position:relative}
@media(min-width:520px){
  body{background:var(--st-100)}
  body.dark{background:#000}
  #app{box-shadow:0 0 0 1px var(--border),0 8px 40px rgba(0,0,0,.08)}
}

/* 应用壳 */
.app-header{position:sticky;top:0;z-index:30;background:var(--bg);padding:14px 16px 10px;
  display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.app-header .brand{display:flex;align-items:baseline;gap:8px}
.app-header .brand .title{font-size:18px;font-weight:600;letter-spacing:-.02em}
.app-header .brand .sub{font-size:11px;color:var(--light)}
.app-header .date{font-size:12px;color:var(--muted)}
.app-main{flex:1;padding:16px;padding-bottom:96px;display:flex;flex-direction:column;gap:12px;overflow-x:hidden}
.app-nav{position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:color-mix(in srgb,var(--card) 95%,transparent);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);max-width:480px;margin:0 auto}
@media(min-width:520px){
  .app-nav{left:50%;right:auto;transform:translateX(-50%);width:480px}
}
.app-nav-inner{display:flex;padding-bottom:env(safe-area-inset-bottom,0)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 0 8px;font-size:10px;color:var(--light);transition:color .15s}
.nav-item.active{color:var(--primary)}
.nav-item .ico{font-size:18px;line-height:1}

/* 通用 */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.02)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;
  padding:8px 14px;border-radius:12px;font-size:14px;font-weight:500;transition:all .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-d)}
body.dark .btn-primary{color:#0c0a09}
.btn-ghost{color:var(--st-600);border:1px solid var(--border);background:var(--card)}
.btn-ghost:hover{background:var(--st-100)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn-danger{color:var(--danger)}
.btn-danger:hover{background:var(--danger-bg)}
.input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--st-300);
  background:var(--card);outline:none;font-size:14px;transition:border-color .15s}
.input:focus{border-color:var(--primary)}
textarea.input{resize:vertical;min-height:80px}
.label{display:block;margin-bottom:6px;font-size:12px;font-weight:500;color:var(--st-500)}

/* 今日页 */
.today-ring-card{display:flex;align-items:center;gap:16px;padding:16px}
.today-ring-card .info{flex:1;min-width:0}
.today-ring-card .info .headline{font-size:18px;font-weight:600;margin-top:4px;letter-spacing:-.01em}
.today-ring-card .info .meta{font-size:12px;color:var(--muted);margin-top:4px}
.ring-wrap{position:relative;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-track{stroke:var(--st-200)}
.ring-fill{stroke:var(--primary);transition:stroke-dashoffset .5s ease}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-label .num{font-size:18px;font-weight:600}
.ring-label .sub{font-size:10px;color:var(--light)}

/* 习惯卡 */
.habit-card{background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.02)}
.habit-row{display:flex;align-items:flex-start;gap:12px}
.habit-icon{width:40px;height:40px;flex-shrink:0;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:18px}
.habit-body{flex:1;min-width:0}
.habit-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.habit-title h3{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge-done{font-size:10px;padding:2px 8px;border-radius:999px;
  background:var(--primary-l);color:var(--primary-t);font-weight:500}
.habit-meta{font-size:12px;color:var(--light);margin-top:2px}
.dot-row{display:flex;align-items:center;gap:5px;margin-top:8px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:999px;flex-shrink:0;background:var(--st-200)}
.dot.done{background:var(--primary)}
.dot.makeup{background:var(--primary);opacity:.5}
.dot.leave{background:#7dd3fc}
.dot.struggle{background:#fbbf24}
.dot.miss{background:var(--st-200)}
.dot.future{background:transparent;border:1px solid var(--st-200)}
.dot-text{font-size:11px;color:var(--st-500);margin-left:4px}
.habit-hint{margin-top:6px;padding:5px 8px;border-radius:8px;font-size:11px;
  background:var(--st-100);color:var(--st-500);line-height:1.5}
.habit-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:12px}
.habit-actions button{color:var(--st-400);padding:0;transition:color .15s}
.habit-actions button:hover{color:var(--primary)}
.expand-area{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);
  display:flex;flex-direction:column;gap:12px;animation:fadeIn .2s ease}
.check-item{display:flex;align-items:center;gap:8px;font-size:14px;padding:4px 0}
.check-item input{width:18px;height:18px;accent-color:var(--primary)}

/* 提议 */
.proposal{border:1px solid var(--amber-border);background:var(--amber-bg);
  border-radius:16px;padding:16px;animation:fadeIn .25s ease}
.proposal-title{display:flex;align-items:center;gap:8px;font-size:14px;
  font-weight:600;color:var(--amber-text);margin-bottom:6px}
.proposal-text{font-size:14px;line-height:1.65;color:var(--amber-text);opacity:.88}
.proposal-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.proposal-actions .accept{background:#d97706;color:#fff;border-radius:12px;
  padding:8px 14px;font-size:14px;font-weight:500}
.proposal-actions .accept:active{transform:scale(.97)}
.proposal-actions .dismiss{color:var(--amber-text);padding:8px 12px;font-size:14px;border-radius:12px}

/* 热力图 */
.heatmap{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.heatmap::-webkit-scrollbar{display:none}
.heatmap-col{display:flex;flex-direction:column;gap:3px}
.heat-cell{width:11px;height:11px;border-radius:2px;flex-shrink:0;background:var(--st-200)}
.heat-cell.l1{background:#99f6e4}
.heat-cell.l2{background:#5eead4}
.heat-cell.l3{background:#14b8a6}
.heat-cell.l4{background:#0f766e}
body.dark .heat-cell.l1{background:#134e4a}
body.dark .heat-cell.l2{background:#115e59}
body.dark .heat-cell.l3{background:#0f766e}
body.dark .heat-cell.l4{background:#2dd4bf}
.heat-cell.future{background:transparent}
.heat-legend{display:flex;align-items:center;gap:3px;margin-top:8px;font-size:10px;color:var(--light)}
.heat-legend .sq{width:10px;height:10px;border-radius:2px}

/* 模板网格 */
.template-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.template-btn{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:14px;text-align:left;transition:all .15s;box-shadow:0 1px 2px rgba(0,0,0,.02)}
.template-btn:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(13,148,136,.1)}
.template-btn:active{transform:scale(.98)}
.template-row{display:flex;align-items:center;gap:10px}
.template-icon{width:32px;height:32px;border-radius:10px;display:flex;
  align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.template-name{font-size:13px;font-weight:500;line-height:1.3}
.template-desc{font-size:11px;color:var(--light);margin-top:2px;line-height:1.4}

/* 模态 */
.modal-overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;
  justify-content:center;background:rgba(0,0,0,.45);animation:fadeIn .15s ease}
@media(min-width:520px){.modal-overlay{align-items:center;padding:16px}}
.modal{background:var(--card);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:20px;display:flex;flex-direction:column;gap:14px;
  animation:slideUp .25s cubic-bezier(.2,.7,.2,1)}
@media(min-width:520px){.modal{border-radius:20px}}
.modal h2{font-size:16px;font-weight:600}
.modal-footer{display:flex;gap:8px;margin-top:4px}
.modal-footer .btn-primary{flex:1}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(20px);opacity:.8}to{transform:none;opacity:1}}

/* 列表/统计 */
.list-header{display:flex;align-items:center;justify-content:space-between}
.list-header h2{font-size:16px;font-weight:600}
.card-head{display:flex;align-items:center;justify-content:space-between}
.card-head .name{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.card-head .meta{font-size:12px;color:var(--light)}
.mini-row{display:flex;gap:6px;margin-top:10px;font-size:12px;flex-wrap:wrap}
.mini-row button{padding:4px 8px;border-radius:8px;color:var(--st-600);transition:background .15s}
.mini-row button:hover{background:var(--st-100)}
.mini-row .danger{color:var(--danger)}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.bar-track{height:6px;border-radius:999px;background:var(--st-200);margin-top:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--primary);border-radius:999px;transition:width .4s}
.stat-meta{font-size:12px;color:var(--st-500);margin-top:4px}
.hint{font-size:11px;color:var(--light);margin-top:4px;line-height:1.6}

/* 设置 */
.settings-section{display:flex;flex-direction:column;gap:12px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column}
.toggle-row{display:flex;align-items:center;justify-content:space-between}
.btn-group{display:flex;flex-wrap:wrap;gap:8px}
.weekday-picker{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.wd-btn{width:38px;height:38px;border-radius:10px;font-size:14px;
  background:var(--st-100);color:var(--st-500);transition:all .15s}
.wd-btn.active{background:var(--primary);color:#fff;font-weight:500}
body.dark .wd-btn.active{color:#0c0a09}
.icon-grid{display:flex;flex-wrap:wrap;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:10px;font-size:18px;
  display:flex;align-items:center;justify-content:center;background:var(--st-100);transition:all .15s}
.icon-btn.active{background:var(--primary-l);box-shadow:0 0 0 2px var(--primary)}
.color-grid{display:flex;gap:8px;flex-wrap:wrap}
.color-btn{width:30px;height:30px;border-radius:999px;flex-shrink:0}
.color-btn.active{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--st-400)}
.kind-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kind-btn{border:1px solid var(--border);border-radius:12px;padding:10px;font-size:13px;
  text-align:center;transition:all .15s}
.kind-btn.active{border-color:var(--primary);background:var(--primary-l);color:var(--primary-t);font-weight:500}
.empty-msg{text-align:center;padding:32px 16px;color:var(--light);font-size:14px}

/* 成就 */
.achv-grid{display:flex;flex-direction:column;gap:10px}
.achv-card{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:14px;display:flex;gap:12px;align-items:flex-start}
.achv-icon{font-size:24px;flex-shrink:0}
.achv-title{font-size:14px;font-weight:500}
.achv-desc{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5}
.achv-date{font-size:11px;color:var(--light);margin-top:4px}

/* ============================================================
   新手引导（概念方案融入）
   ============================================================ */
.onboarding{position:fixed;inset:0;z-index:200;background:var(--bg);
  max-width:480px;margin:0 auto;display:flex;flex-direction:column;
  animation:fadeIn .3s ease}
.ob-header{display:flex;justify-content:space-between;align-items:center;
  padding:18px 20px 10px;flex-shrink:0}
.ob-dots{display:flex;gap:6px}
.ob-dot{width:6px;height:6px;border-radius:100px;background:var(--st-200);transition:all .25s}
.ob-dot.on{background:var(--primary);width:20px}
.ob-dot.done{background:var(--primary);opacity:.4}
.ob-skip{font-size:13px;color:var(--muted);padding:6px 10px;border-radius:8px}
.ob-skip:hover{background:var(--st-100)}
.ob-body{flex:1;padding:24px 28px;display:flex;flex-direction:column;
  justify-content:center;gap:24px;overflow-y:auto;animation:obIn .4s ease}
@keyframes obIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ob-visual{display:flex;justify-content:center;align-items:center;min-height:220px}
.ob-title{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.ob-text{font-size:15px;color:var(--muted);line-height:1.75;margin-top:12px}
.ob-actions{padding:16px 20px calc(20px + env(safe-area-inset-bottom,0px));
  display:flex;gap:10px;flex-shrink:0;border-top:1px solid var(--border);background:var(--bg)}
.ob-actions .btn{flex:1;padding:14px;font-size:15px;border-radius:14px}

/* 视觉示意：一致性点阵 */
.ob-demo-consistency{background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:24px 20px;width:100%;max-width:340px;text-align:center}
.ob-demo-dots{display:flex;justify-content:center;gap:8px;margin-bottom:16px}
.ob-demo-dot{width:16px;height:16px;border-radius:100px;background:var(--st-200)}
.ob-demo-dot.done{background:var(--primary)}
.ob-demo-text{font-size:15px;font-weight:500}
.ob-demo-text strong{color:var(--primary);font-size:20px;font-weight:600}
.ob-demo-sub{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}

/* 视觉示意：提议卡片 */
.ob-demo-proposal{background:var(--amber-bg);border:1px solid var(--amber-border);
  border-radius:16px;padding:18px;width:100%;max-width:340px}
.ob-demo-proposal-title{display:flex;align-items:center;gap:8px;font-size:15px;
  font-weight:600;color:var(--amber-text);margin-bottom:8px}
.ob-demo-proposal-text{font-size:14px;line-height:1.65;color:var(--amber-text);opacity:.88}
.ob-demo-proposal-actions{display:flex;gap:8px;margin-top:14px}
.ob-demo-proposal-actions span{font-size:13px;padding:7px 12px;border-radius:10px}
.ob-demo-proposal-actions .accept{background:#d97706;color:#fff;font-weight:500}
.ob-demo-proposal-actions .dismiss{color:var(--amber-text)}

/* 视觉示意：通知 */
.ob-demo-notif{background:var(--card);border:1px solid var(--border);
  border-radius:18px;padding:14px;width:100%;max-width:340px;
  box-shadow:0 8px 24px rgba(0,0,0,.08);display:flex;gap:12px;align-items:flex-start}
.ob-demo-notif-icon{width:36px;height:36px;border-radius:10px;background:var(--primary);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
body.dark .ob-demo-notif-icon{color:#0c0a09}
.ob-demo-notif-title{font-size:13px;font-weight:600}
.ob-demo-notif-text{font-size:12px;color:var(--muted);line-height:1.6;margin-top:3px}
.ob-demo-below{text-align:center;font-size:12px;color:var(--light);
  margin-top:20px;line-height:1.7}

/* 视觉示意：模板网格（最后一步） */
.ob-templates{display:grid;grid-template-columns:1fr 1fr;gap:10px;
  width:100%;max-width:340px}
.ob-template{background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:14px;text-align:left;transition:all .15s}
.ob-template:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(13,148,136,.12)}
.ob-template:active{transform:scale(.97)}
.ob-template-icon{width:36px;height:36px;border-radius:10px;display:flex;
  align-items:center;justify-content:center;font-size:18px;margin-bottom:8px}
.ob-template-name{font-size:13px;font-weight:500;line-height:1.3}
.ob-template-desc{font-size:11px;color:var(--light);margin-top:2px;line-height:1.4}

/* 欢迎页 */
.ob-welcome{text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.ob-welcome-logo{width:88px;height:88px;border-radius:26px;
  background:linear-gradient(145deg,var(--primary),var(--primary-d));
  display:flex;align-items:center;justify-content:center;font-size:44px;
  box-shadow:0 12px 32px rgba(13,148,136,.3)}
.ob-welcome-tag{font-size:12px;font-weight:500;color:var(--primary-t);
  background:var(--primary-l);padding:4px 12px;border-radius:100px}
.ob-welcome-title{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.ob-welcome-sub{font-size:15px;color:var(--muted);line-height:1.7;max-width:280px}

/* ============================================================
   v5 新增：恢复模式、领域、叙事、MVP、档案
   ============================================================ */
.mode-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 7px;border-radius:999px;font-weight:500;margin-left:6px}
.mode-travel{background:#dbeafe;color:#1e40af}
.mode-maintenance{background:#fef3c7;color:#92400e}
.mode-recovery{background:#dcfce7;color:#166534}
.mode-paused{background:#f1f5f9;color:#475569}
body.dark .mode-travel{background:rgba(59,130,246,.2);color:#93c5fd}
body.dark .mode-maintenance{background:rgba(245,158,11,.2);color:#fcd34d}
body.dark .mode-recovery{background:rgba(34,197,94,.2);color:#86efac}
body.dark .mode-paused{background:rgba(148,163,184,.2);color:#94a3b8}
.domain-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center;transition:border-color .15s;cursor:pointer;width:100%;text-align:left;font-family:inherit}
.domain-card:hover{border-color:var(--primary)}
.domain-dot{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.domain-meta{flex:1;min-width:0}
.domain-meta .nm{font-size:14px;font-weight:500}
.domain-meta .dt{font-size:11px;color:var(--light);margin-top:2px}
.narrative{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;line-height:1.8;font-size:14px;white-space:pre-wrap}

<body>
<div id="app"></div>

<script>
/* ============================================================
   1. 工具
   ============================================================ */
var pad=function(n){return String(n).padStart(2,'0');};
var toISO=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var todayISO=function(){return toISO(new Date());};
var parseISO=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
var addDays=function(iso,n){var d=parseISO(iso);d.setDate(d.getDate()+n);return toISO(d);};
var diffDays=function(a,b){return Math.round((parseISO(b)-parseISO(a))/86400000);};
var weekdayOf=function(iso){return parseISO(iso).getDay();};
var lastNDays=function(n,end){var out=[];for(var i=n-1;i>=0;i--)out.push(addDays(end,-i));return out;};
var weekStartISO=function(iso,ws){ws=ws==null?1:ws;return addDays(iso,-((weekdayOf(iso)-ws+7)%7));};
var formatCN=function(iso){var d=parseISO(iso);return (d.getMonth()+1)+'月'+d.getDate()+'日';};
var uid=function(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};

var WEEK_NAMES=['日','一','二','三','四','五','六'];
var WEEK_FULL=['周日','周一','周二','周三','周四','周五','周六'];

/* ============================================================
   2. 频率与周期
   ============================================================ */
function isScheduledDay(freq,iso){
  if(freq.kind==='weekdays') return (freq.weekdays||[]).indexOf(weekdayOf(iso))>=0;
  return true;
}
function expectedCount(freq,days){
  switch(freq.kind){
    case 'daily':return days;
    case 'weekdays':return days*((freq.weekdays||[]).length/7);
    case 'weekly_n':return (days/7)*(freq.n||0);
    case 'interval':return days/Math.max(1,freq.intervalDays||1);
    default:return days;
  }
}
function describeFrequency(freq){
  switch(freq.kind){
    case 'daily':return '每天';
    case 'weekly_n':return '每周 '+(freq.n||1)+' 次';
    case 'weekdays':return '每周 '+(freq.weekdays||[]).map(function(d){return WEEK_NAMES[d];}).join('、');
    case 'interval':return '每 '+(freq.intervalDays||1)+' 天一次';
    default:return '';
  }
}
function buildPeriods(habit,fromISO,toISOv){
  var freq=habit.frequency,out=[],iso,ws,we,n,total,cnt,i,s,e;
  if(freq.kind==='daily'||freq.kind==='weekdays'){
    for(iso=fromISO;iso<=toISOv;iso=addDays(iso,1)){
      if(isScheduledDay(freq,iso))out.push({start:iso,end:iso,expected:1});
    }
    return out;
  }
  if(freq.kind==='weekly_n'){
    ws=weekStartISO(fromISO,1);
    while(ws<=toISOv){
      we=addDays(ws,6);
      out.push({start:ws<fromISO?fromISO:ws,end:we>toISOv?toISOv:we,expected:Math.max(1,freq.n||1)});
      ws=addDays(ws,7);
    }
    return out;
  }
  n=Math.max(1,freq.intervalDays||1);total=diffDays(habit.startDate,toISOv);
  if(total>=0){
    cnt=Math.floor(total/n)+1;
    for(i=0;i<cnt;i++){
      s=addDays(habit.startDate,i*n);e=addDays(s,n-1);
      if(e<fromISO||s>toISOv)continue;
      out.push({start:s<fromISO?fromISO:s,end:e>toISOv?toISOv:e,expected:1});
    }
  }
  return out;
}

/* ============================================================
   3. 一致性 / 连续
   ============================================================ */
function isCompleted(c,habit){
  if(!c)return false;
  if(c.status==='done')return true;
  if(c.status==='partial'&&habit.kind==='quantitative')return c.value>=(habit.targetValue||1);
  return false;
}
function computeConsistency(habit,checkins,windowDays,endISO){
  var days=lastNDays(windowDays,endISO),byDate={},completedDays=0,makeupCount=0,leaveDays=0,cells=[],i,d,c;
  for(i=0;i<checkins.length;i++)if(checkins[i].habitId===habit.id)byDate[checkins[i].date]=checkins[i];
  for(i=0;i<days.length;i++){
    d=days[i];
    if(d>endISO){cells.push({date:d,state:'future'});continue;}
    c=byDate[d];
    if(c&&c.status==='leave'){leaveDays++;cells.push({date:d,state:'leave'});continue;}
    if(c&&isCompleted(c,habit)){
      completedDays++;if(c.isMakeup)makeupCount++;
      cells.push({date:d,state:c.isMakeup?'makeup':'done'});continue;
    }
    if(c&&c.status==='struggle'){cells.push({date:d,state:'struggle'});continue;}
    cells.push({date:d,state:'miss'});
  }
  var expected=Math.max(0,expectedCount(habit.frequency,windowDays)-leaveDays);
  return {windowDays:windowDays,completedDays:completedDays,expected:expected,makeupCount:makeupCount,
    leaveDays:leaveDays,cells:cells,ratio:expected===0?0:Math.min(1,completedDays/expected)};
}
function computeStreak(habit,checkins,today){
  today=today||todayISO();
  var periods=buildPeriods(habit,habit.startDate,today),doneDates={},i,current=0,best=0,p,count,d,satisfied,isCurrent;
  for(i=0;i<checkins.length;i++){
    if(checkins[i].habitId===habit.id&&isCompleted(checkins[i],habit))doneDates[checkins[i].date]=1;
  }
  for(i=0;i<periods.length;i++){
    p=periods[i];count=0;
    for(d in doneDates)if(d>=p.start&&d<=p.end)count++;
    satisfied=count>=p.expected;isCurrent=today>=p.start&&today<=p.end;
    if(satisfied){current++;if(current>best)best=current;}
    else if(!isCurrent)current=0;
  }
  return {current:current,best:best};
}
function totalCheckins(habit,checkins){
  var n=0,i;
  for(i=0;i<checkins.length;i++)if(checkins[i].habitId===habit.id&&isCompleted(checkins[i],habit))n++;
  return n;
}

/* ============================================================
   4. 动态调适
   ============================================================ */
var NOTE_KEYWORDS=['没时间','太累','忘了','来不及','忙'];
function generateProposals(habits,checkins,today){
  var out=[],i,habit,w7,w14,recent,hasKw,downKey,upKey,stable,next,miss,j,d,wd,c,wds,worst,refKey;
  for(i=0;i<habits.length;i++){
    habit=habits[i];
    if(habit.status!=='active')continue;
    if(habit.adaptive.lastProposalDate&&diffDays(habit.adaptive.lastProposalDate,today)<14)continue;
    w7=computeConsistency(habit,checkins,7,today);
    w14=computeConsistency(habit,checkins,14,today);
    recent=checkins.filter(function(c){return c.habitId===habit.id&&c.date>=addDays(today,-7)&&c.note;});
    hasKw=recent.some(function(c){return NOTE_KEYWORDS.some(function(k){return(c.note||'').indexOf(k)>=0;});});
    downKey='downgrade:'+habit.id+':'+habit.targetValue;
    if(w7.ratio<=0.3&&w7.expected>=2&&(hasKw||w7.completedDays<=1)&&habit.adaptive.declinedKeys.indexOf(downKey)<0){
      if(habit.kind==='quantitative'&&habit.targetValue>1){
        next=Math.max(1,Math.round(habit.targetValue*0.5));
        out.push({key:downKey,habitId:habit.id,title:'调整节奏',
          message:'过去 7 天你完成了 '+w7.completedDays+' 次。看起来现在这个目标有点重 —— 要不要先把「'+habit.name+'」从 '+habit.targetValue+habit.unit+' 调成 '+next+habit.unit+'？等节奏稳了再调回来，随时可以改。',
          acceptLabel:'先按 '+next+habit.unit,dismissLabel:'暂不调整',patch:{targetValue:next}});
        continue;
      }
      if(habit.frequency.kind==='daily'){
        out.push({key:downKey,habitId:habit.id,title:'调整节奏',
          message:'每天都做可能对现在来说太紧了。要不要把「'+habit.name+'」改成每周 3 次？做到的那几天仍然算数，过去完成的天数不会消失。',
          acceptLabel:'改成每周 3 次',dismissLabel:'暂不调整',patch:{frequency:{kind:'weekly_n',n:3}}});
        continue;
      }
    }
    upKey='upgrade:'+habit.id+':'+habit.targetValue;
    stable=!habit.adaptive.lastChangeDate||diffDays(habit.adaptive.lastChangeDate,today)>=14;
    if(w14.ratio>=0.8&&w14.completedDays>=8&&w14.makeupCount===0&&habit.kind==='quantitative'&&stable&&habit.adaptive.declinedKeys.indexOf(upKey)<0){
      next=Math.max(habit.targetValue+1,Math.round(habit.targetValue*1.25));
      out.push({key:upKey,habitId:habit.id,title:'可以再走一小步',
        message:'过去两周你完成了 '+w14.completedDays+' 次，很稳。要不要试试 '+next+habit.unit+'？只是提议，不合适随时可以改回来。',
        acceptLabel:'试试 '+next+habit.unit,dismissLabel:'先保持',patch:{targetValue:next}});
      continue;
    }
    if(habit.frequency.kind==='weekdays'){
      wds=habit.frequency.weekdays||[];
      if(wds.length>1){
        miss={};
        for(j=1;j<=28;j++){
          d=addDays(today,-j);wd=weekdayOf(d);
          if(wds.indexOf(wd)<0)continue;
          c=checkins.filter(function(x){return x.habitId===habit.id&&x.date===d;})[0];
          if(!c||c.status==='struggle')miss[wd]=(miss[wd]||0)+1;
        }
        worst=Object.keys(miss).sort(function(a,b){return miss[b]-miss[a];})[0];
        refKey='refreq:'+habit.id+':'+(worst||'');
        if(worst!==undefined&&miss[worst]>=3&&habit.adaptive.declinedKeys.indexOf(refKey)<0){
          out.push({key:refKey,habitId:habit.id,title:'这一天似乎总是很难',
            message:'过去 4 周里「'+habit.name+'」在'+WEEK_FULL[Number(worst)]+'缺了 '+miss[worst]+' 次。这不是失败，只是这一天本就更忙。要不要把它从计划里拿掉，让剩下的日子更轻松？',
            acceptLabel:'去掉'+WEEK_FULL[Number(worst)],dismissLabel:'保留',
            patch:{frequency:{kind:'weekdays',weekdays:wds.filter(function(d){return d!==Number(worst);})}}});
        }
      }
    }
  }
  return out.slice(0,2);
}

/* ============================================================
   5. 通知
   ============================================================ */
function inQuietHours(now,from,to){
  if(from===to)return false;
  if(from<to)return now>=from&&now<to;
  return now>=from||now<to;
}
function decideNotification(habit,checkins,nowDate,quietFrom,quietTo){
  if(habit.status!=='active'||!habit.reminder.enabled)return{action:'skip'};
  if(habit.notifState.mode==='off')return{action:'skip'};
  var today=todayISO(),hhmm=pad(nowDate.getHours())+':'+pad(nowDate.getMinutes());
  if(inQuietHours(hhmm,quietFrom,quietTo))return{action:'skip'};
  var c=checkins.filter(function(x){return x.habitId===habit.id&&x.date===today;})[0];
  if(c&&c.status!=='struggle'&&c.status!=='leave')return{action:'skip'};
  if(habit.notifState.mode==='reduced'){
    if(weekdayOf(today)!==1||hhmm<habit.reminder.time)return{action:'skip'};
    return{action:'send',reason:'每周摘要'};
  }
  if(hhmm<habit.reminder.time)return{action:'skip'};
  if(habit.notifState.preReminderStreak>=5)return{action:'downgrade-mode'};
  return{action:'send',reason:'按计划提醒'};
}
function recoveryHint(habit,checkins,today){
  if(habit.status!=='active')return null;
  var wd=weekdayOf(today),miss=0,total=0,i,d,iso,c;
  for(i=1;i<=28;i++){
    d=new Date();d.setDate(d.getDate()-i);
    if(d.getDay()!==wd)continue;
    total++;iso=toISO(d);
    c=checkins.filter(function(x){return x.habitId===habit.id&&x.date===iso;})[0];
    if(!c||c.status==='struggle')miss++;
  }
  if(total>=3&&miss>=3)return '今天通常是较难的一天 —— 只做最小版本也算数。';
  return null;
}

/* ============================================================
   6. 模板
   ============================================================ */
var TEMPLATES=[
  {name:'阅读 10 分钟',icon:'📖',color:'#3b82f6',kind:'quantitative',targetValue:10,unit:'分钟',frequency:{kind:'daily'},description:'从最小可完成开始'},
  {name:'喝够 8 杯水',icon:'💧',color:'#06b6d4',kind:'quantitative',targetValue:8,unit:'杯',frequency:{kind:'daily'},description:'定量目标，记录数值'},
  {name:'运动 20 分钟',icon:'🏃',color:'#f97316',kind:'quantitative',targetValue:20,unit:'分钟',frequency:{kind:'weekly_n',n:3},description:'每周 3 次，不绑定具体日'},
  {name:'冥想 5 分钟',icon:'🧘',color:'#8b5cf6',kind:'positive',targetValue:1,unit:'',frequency:{kind:'daily'},description:'正向养成'},
  {name:'不刷短视频',icon:'📵',color:'#ef4444',kind:'negative',targetValue:1,unit:'',frequency:{kind:'daily'},description:'负向戒除，做到了就打卡'},
  {name:'睡前复盘',icon:'🌙',color:'#6366f1',kind:'checklist',targetValue:2,unit:'项',frequency:{kind:'daily'},checklist:['写下今天的一件小事','明天最重要的一件事'],description:'清单型习惯'},
  {name:'早起',icon:'🌅',color:'#eab308',kind:'positive',targetValue:1,unit:'',frequency:{kind:'weekdays',weekdays:[1,2,3,4,5]},description:'指定星期几'},
  {name:'背单词',icon:'🔤',color:'#10b981',kind:'quantitative',targetValue:20,unit:'个',frequency:{kind:'daily'},description:'定量目标'}
];
function habitFromTemplate(t){
  var target=t.checklist?t.checklist.length:t.targetValue;
  return Object.assign(DEFAULT_HABIT_FIELDS({}),{
    id:uid(),name:t.name,icon:t.icon,color:t.color,kind:t.kind,targetValue:target,unit:t.unit,
    frequency:t.frequency,checklist:t.checklist||[],startDate:todayISO(),allowMakeup:true,status:'active',
    createdAt:new Date().toISOString(),reminder:{enabled:false,time:'20:00'},
    notifState:{mode:'active',preReminderStreak:0},
    adaptive:{baseTargetValue:target,baseFrequency:t.frequency,declinedKeys:[]},
    domainId:t.domainId||'mind',intent:(t.description||'')
  });
}

/* ============================================================
   7. 状态
   ============================================================ */
/* v5 领域/意图常量 */
var DOMAINS=[
  {id:'health',  name:'身体', icon:'💪', color:'#f97316', desc:'动起来、睡够、饮食'},
  {id:'mind',    name:'心智', icon:'🧠', color:'#8b5cf6', desc:'专注、冥想、学习'},
  {id:'craft',   name:'技艺', icon:'🎨', color:'#3b82f6', desc:'创作、阅读、表达'},
  {id:'relation',name:'联结', icon:'💞', color:'#ec4899', desc:'家人、朋友、沟通'},
  {id:'wealth',  name:'富足', icon:'💰', color:'#10b981', desc:'工作、储蓄、效率'}
];
var MODES=[
  {id:'normal',      label:'常规', icon:''},
  {id:'travel',      label:'差旅', icon:'🚶'},
  {id:'maintenance', label:'维护', icon:'🔧'},
  {id:'recovery',    label:'恢复', icon:'♻️'},
  {id:'paused',      label:'暂停', icon:'⏸'}
];
var DOMAIN_MAP={};
DOMAINS.forEach(function(d){DOMAIN_MAP[d.id]=d;});
function DEFAULT_HABIT_FIELDS(h){
  if(!h)h={};
  return Object.assign({
    domainId:'mind',intentId:null,mode:'normal',minimumViable:{value:null,unit:'',description:'',enabled:false},
    cooldownUntil:null,rhythmProfile:null,intent:''
  },h);
}

var STORAGE_KEY='habitstep-v2';
var DEFAULT_SETTINGS={theme:'system',weekStartsOn:1,notificationsEnabled:false,
  dontDisturbFrom:'22:30',dontDisturbTo:'07:30',consistencyWindow:7,onboarded:false,
  domainColors:{health:'#f97316',mind:'#8b5cf6',craft:'#3b82f6',relation:'#ec4899',wealth:'#10b981'},
  domainIcons:{health:'💪',mind:'🧠',craft:'🎨',relation:'💞',wealth:'💰'}};
var STREAK_MILESTONES=[3,7,21,30,100];
var TOTAL_MILESTONES=[10,50,100,365];

var state=loadState();
var uiState={
  tab:'today',
  expanded:{},
  showOnboarding:!state.settings.onboarded&&state.habits.length===0,
  onboardStep:0
};

function upgradeHabits(arr){
  return (arr||[]).map(function(h){
    // 保留所有 v4 字段，v5 字段仅在缺失时补齐
    h=h||{};
    if(!('domainId' in h))h.domainId='mind';
    if(!('mode' in h))h.mode='normal';
    if(!('intentId' in h))h.intentId=null;
    if(!('minimumViable' in h)||!h.minimumViable)h.minimumViable={value:null,unit:'',description:'',enabled:false};
    if(!('cooldownUntil' in h))h.cooldownUntil=null;
    if(!('rhythmProfile' in h))h.rhythmProfile=null;
    if(!('intent' in h))h.intent='';
    return h;
  });
}
function loadState(){
  try{
    var raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return {habits:[],checkins:[],achievements:[],settings:Object.assign({},DEFAULT_SETTINGS),
      domains:null,intents:[],archiveEntries:[]};
    var p=JSON.parse(raw);
    return {habits:upgradeHabits(p.habits||[]),checkins:p.checkins||[],achievements:p.achievements||[],
      settings:Object.assign({},DEFAULT_SETTINGS,p.settings||{}),
      domains:p.domains||null,intents:p.intents||[],archiveEntries:p.archiveEntries||[]};
  }catch(e){
    return {habits:[],checkins:[],achievements:[],settings:Object.assign({},DEFAULT_SETTINGS),
      domains:null,intents:[],archiveEntries:[]};
  }
}
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}}

/* ============================================================
   8. 操作
   ============================================================ */
function evaluateAchievements(habitId){
  var next=state.achievements.slice(),has=function(code,hid){return next.some(function(a){return a.code===code&&a.habitId===hid;});};
  var targets=habitId?state.habits.filter(function(h){return h.id===habitId;}):state.habits;
  targets.forEach(function(habit){
    var streak=computeStreak(habit,state.checkins);
    STREAK_MILESTONES.forEach(function(m){
      if(streak.best>=m&&!has('streak-'+m,habit.id)){
        next.push({id:uid(),code:'streak-'+m,habitId:habit.id,title:m+' 次连续',
          description:'「'+habit.name+'」达成 '+m+' 次连续。这个成就永久保留。',
          unlockedAt:new Date().toISOString()});
      }
    });
    var total=totalCheckins(habit,state.checkins);
    TOTAL_MILESTONES.forEach(function(m){
      if(total>=m&&!has('total-'+m,habit.id)){
        next.push({id:uid(),code:'total-'+m,habitId:habit.id,title:'累计 '+m+' 次',
          description:'「'+habit.name+'」累计完成 '+m+' 次。',
          unlockedAt:new Date().toISOString()});
      }
    });
  });
  if(next.length!==state.achievements.length){state.achievements=next;saveState();}
}
function addHabit(h){state.habits.push(h);saveState();render();}
function updateHabit(id,patch){
  var idx=state.habits.findIndex(function(h){return h.id===id;});
  if(idx>=0){state.habits[idx]=Object.assign({},state.habits[idx],patch);saveState();render();}
}
function archiveHabit(id){var h=state.habits.find(function(x){return x.id===id;});if(h){h.status='archived';saveState();render();}}
function restoreHabit(id){var h=state.habits.find(function(x){return x.id===id;});if(h){h.status='active';saveState();render();}}
function deleteHabit(id){
  state.habits=state.habits.filter(function(h){return h.id!==id;});
  state.checkins=state.checkins.filter(function(c){return c.habitId!==id;});
  saveState();render();
}
function checkIn(habitId,payload){
  payload=payload||{};
  var habit=state.habits.find(function(h){return h.id===habitId;});
  if(!habit)return;
  var date=payload.date||todayISO();
  var existing=state.checkins.filter(function(c){return c.habitId===habitId&&c.date===date;})[0];
  if(existing){Object.assign(existing,payload,{id:existing.id,habitId:habitId,date:date});}
  else{
    state.checkins.push({id:uid(),habitId:habitId,date:date,
      value:payload.value!==undefined?payload.value:habit.targetValue,
      status:payload.status||'done',note:payload.note,mood:payload.mood,
      isMakeup:!!payload.isMakeup,createdAt:new Date().toISOString()});
  }
  if(habit.reminder.enabled&&!payload.isMakeup){
    var now=new Date(),hhmm=pad(now.getHours())+':'+pad(now.getMinutes());
    if(hhmm<habit.reminder.time)habit.notifState.preReminderStreak++;
  }
  saveState();evaluateAchievements(habitId);render();
}
function undoCheckIn(habitId,date){
  var d=date||todayISO();
  state.checkins=state.checkins.filter(function(c){return!(c.habitId===habitId&&c.date===d);});
  saveState();render();
}
function updateSettings(patch){state.settings=Object.assign({},state.settings,patch);saveState();render();}
function dismissProposal(habitId,key){
  var h=state.habits.find(function(x){return x.id===habitId;});
  if(!h)return;
  h.adaptive.declinedKeys.push(key);h.adaptive.lastProposalDate=todayISO();
  saveState();render();
}
function applyProposal(habitId,patch,key){
  var h=state.habits.find(function(x){return x.id===habitId;});
  if(!h)return;
  Object.assign(h,patch);
  h.adaptive.lastChangeDate=todayISO();h.adaptive.lastProposalDate=todayISO();
  h.adaptive.declinedKeys.push(key);
  saveState();render();
}
function exportData(){return JSON.stringify({version:5,exportedAt:new Date().toISOString(),habits:state.habits,checkins:state.checkins,achievements:state.achievements,settings:state.settings,domains:state.domains,intents:state.intents,archiveEntries:state.archiveEntries},null,2);}
function importData(json){
  try{
    var p=JSON.parse(json);
    if(!Array.isArray(p.habits)||!Array.isArray(p.checkins))return false;
    state={habits:upgradeHabits(p.habits),checkins:p.checkins,achievements:p.achievements||[],
      settings:Object.assign({},DEFAULT_SETTINGS,p.settings||{}),
      domains:p.domains||null,intents:p.intents||[],archiveEntries:p.archiveEntries||[]};
    saveState();render();return true;
  }catch(e){return false;}
}
function resetAll(){state={habits:[],checkins:[],achievements:[],settings:Object.assign({},DEFAULT_SETTINGS),domains:null,intents:[],archiveEntries:[]};saveState();render();}

function renderRing(ratio,size,label,sub){
  size=size||90;var stroke=8,r=(size-stroke)/2,c=2*Math.PI*r,v=Math.max(0,Math.min(1,ratio||0));
  return '<div class="ring-wrap" style="width:'+size+'px;height:'+size+'px">'+
    '<svg width="'+size+'" height="'+size+'">'+
    '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke-width="'+stroke+'" class="ring-track"/>'+
    '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke-width="'+stroke+'" stroke-linecap="round" class="ring-fill" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-v))+'"/>'+
    '</svg>'+
    '<div class="ring-label"><span class="num">'+label+'</span>'+(sub?'<span class="sub">'+sub+'</span>':'')+'</div>'+
    '</div>';
}
function renderHeatmap(weeks){
  weeks=weeks||14;
  var today=todayISO(),start=addDays(weekStartISO(today,1),-(weeks-1)*7);
  var habitMap={},countMap={};
  state.habits.filter(function(h){return h.status==='active';}).forEach(function(h){habitMap[h.id]=h;});
  state.checkins.forEach(function(c){
    var h=habitMap[c.habitId];
    if(!h||!isCompleted(c,h))return;
    countMap[c.date]=(countMap[c.date]||0)+1;
  });
  var cols='',w,d,iso,future,n,lvl,col;
  for(w=0;w<weeks;w++){
    col='';
    for(d=0;d<7;d++){
      iso=addDays(start,w*7+d);future=iso>today;n=countMap[iso]||0;
      lvl=future?0:(n===0?0:n===1?1:n===2?2:n===3?3:4);
      col+='<div class="heat-cell '+(future?'future':'l'+lvl)+'" title="'+iso+(future?'':' · '+n+' 次')+'"></div>';
    }
    cols+='<div class="heatmap-col">'+col+'</div>';
  }
  var legend=[0,1,2,3,4].map(function(l){return '<span class="sq heat-cell l'+l+'"></span>';}).join('');
  return '<div class="heatmap">'+cols+'</div><div class="heat-legend"><span>少</span>'+legend+'<span>多</span></div>';
}
function renderHabitCard(h){
  var today=todayISO();
  var todayCheckin=state.checkins.filter(function(c){return c.habitId===h.id&&c.date===today;})[0];
  var doneToday=isCompleted(todayCheckin,h);
  var cons=computeConsistency(h,state.checkins,state.settings.consistencyWindow,today);
  var hint=recoveryHint(h,state.checkins,today);
  var expanded=!!uiState.expanded[h.id];
  var dots=cons.cells.map(function(c){return '<span class="dot '+c.state+'" title="'+c.date+'"></span>';}).join('');
  var expectedTxt=cons.expected>=1?' / 目标 '+Math.round(cons.expected)+' 次':'';
  // v5 mode 徽章
  var modeBadge='';
  if(h.mode&&h.mode!=='normal'){
    var mDef=MODES.filter(function(x){return x.id===h.mode;})[0]||{icon:'',label:h.mode};
    modeBadge='<span class="mode-badge mode-'+h.mode+'">'+mDef.icon+' '+mDef.label+'</span>';
  }
  // v5 领域标签
  var domainTag='';
  if(h.domainId&&DOMAIN_MAP[h.domainId])domainTag='<span class="domain-chip">'+DOMAIN_MAP[h.domainId].icon+' '+DOMAIN_MAP[h.domainId].name+'</span>';
  var expandHtml='';

    var inner='';
    if(h.kind==='quantitative'){
      inner+='<div><label class="label">完成量（'+esc(h.unit||'次')+'），目标 '+h.targetValue+'</label><input class="input" type="number" id="val-'+h.id+'" value="'+h.targetValue+'"></div>';
    }else if(h.kind==='checklist'){
      inner+='<div style="display:flex;flex-direction:column;gap:4px">'+h.checklist.map(function(item,i){
        return '<label class="check-item"><input type="checkbox" data-cl-item="'+i+'" data-id="'+h.id+'"> '+esc(item)+'</label>';
      }).join('')+'</div>';
    }
    inner+='<div><label class="label">备注（可选）</label><input class="input" id="note-'+h.id+'" placeholder="今天感觉如何？"></div>'+
      '<div style="display:flex;gap:8px"><button class="btn btn-primary" data-action="save" data-id="'+h.id+'">保存</button><button class="btn btn-ghost" data-action="collapse" data-id="'+h.id+'">取消</button></div>';
    // v5 MVP 切换按钮（expanded 底部）
    var mvp=h.minimumViable||{value:null,unit:'',description:'',enabled:false};
    var mvpOn=!!mvp.enabled;
    var mvpDisplay='';
    if(mvpOn){
      mvpDisplay='<div class="mvp-row"><div>最小可完成：'+esc(mvp.description||((mvp.value!=null?mvp.value:1)+esc(mvp.unit||'')+' · 也算数'))+'</div>'+
        '<button class="btn btn-ghost btn-sm" data-action="toggle-mvp" data-id="'+h.id+'" data-target-hide="'+h.id+'">关闭 MVP</button></div>';
    }else{
      mvpDisplay='<div class="mvp-row"><div>没力气？开「最小可完成」：做到一点也算数</div>'+
        '<button class="btn btn-primary btn-sm" data-action="toggle-mvp" data-id="'+h.id+'">开启 MVP</button></div>';
    }
    inner+=mvpDisplay;
    expandHtml='<div class="expand-area">'+inner+'</div>';
  }
  var actions=doneToday?'':'<div class="habit-actions">'+
    '<button data-action="struggle" data-id="'+h.id+'">今天很难</button>'+
    '<button data-action="leave" data-id="'+h.id+'">请假</button>'+
    (h.kind!=='quantitative'&&h.kind!=='checklist'?'<button data-action="expand" data-id="'+h.id+'">记录详情</button>':'')+
    '</div>';
  return '<div class="habit-card">'+
    '<div class="habit-row">'+
      '<div class="habit-icon" style="background:'+h.color+'20">'+h.icon+'</div>'+
      '<div class="habit-body">'+
        '<div class="habit-title"><h3>'+esc(h.name)+'</h3>'+(doneToday?'<span class="badge-done">已完成</span>':'')+modeBadge+'</div>'+
        '<div class="habit-meta">'+describeFrequency(h.frequency)+(h.kind==='quantitative'?' · 目标 '+h.targetValue+esc(h.unit):'')+domainTag+'</div>'+
        '<div class="dot-row">'+dots+'<span class="dot-text">过去 '+cons.windowDays+' 天完成 '+cons.completedDays+' 次'+expectedTxt+'</span></div>'+
        (cons.makeupCount>0?'<p style="font-size:11px;color:var(--light);margin-top:4px">其中补卡 '+cons.makeupCount+' 次，已标注</p>':'')+
        (hint&&!doneToday?'<p class="habit-hint">'+esc(hint)+'</p>':'')+
      '</div>'+
      '<button class="btn '+(doneToday?'btn-ghost':'btn-primary')+'" data-action="'+(doneToday?'undo':'checkin')+'" data-id="'+h.id+'">'+
        (doneToday?'撤销':(h.kind==='negative'?'做到了':'打卡'))+
      '</button>'+
    '</div>'+actions+expandHtml+'</div>';
}

function renderStats(){
  var today=todayISO();
  var active=state.habits.filter(function(h){return h.status==='active';});
  var rows=active.map(function(h){return{habit:h,w7:computeConsistency(h,state.checkins,7,today),w30:computeConsistency(h,state.checkins,30,today),streak:computeStreak(h,state.checkins,today)};});
  var ws=weekStartISO(today,1);
  var weekDays=Array.from({length:7},function(_,i){return addDays(ws,i);}).filter(function(d){return d<=today;});

  rows.forEach(function(r){
    var n=weekDays.filter(function(d){var c=r.w7.cells.filter(function(x){return x.date===d;})[0];return c&&(c.state==='done'||c.state==='makeup');}).length;
    totalDone+=n;if(!best||n>best.count)best={name:r.habit.name,count:n};

  html+='<div style="display:flex;flex-direction:column;gap:10px">'+rows.map(function(r){

      '<div class="card-head"><div class="name"><span>'+r.habit.icon+'</span>'+esc(r.habit.name)+'</div><div class="meta">历史最佳 '+r.streak.best+'</div></div>'+
      '<div class="stat-row">'+
        '<div><div style="font-size:11px;color:var(--light)">近 7 天一致性</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(r.w7.ratio*100)+'%"></div></div><div class="stat-meta">'+r.w7.completedDays+' / '+Math.round(r.w7.expected)+' 次</div></div>'+
        '<div><div style="font-size:11px;color:var(--light)">近 30 天一致性</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(r.w30.ratio*100)+'%"></div></div><div class="stat-meta">'+r.w30.completedDays+' / '+Math.round(r.w30.expected)+' 次'+(r.w30.makeupCount>0?' · 补卡 '+r.w30.makeupCount:'')+'</div></div>'+
      '</div></div>';
  }).join('')+'</div>';
  return html;
}

document.addEventListener('click',function(e){
  var btn=e.target.closest('[data-action]');
  if(!btn)return;
  var action=btn.dataset.action;
  var id=btn.dataset.id;
  var key=btn.dataset.key;

  switch(action){
    /* —— 新手引导 —— */
    case 'ob-next':
      if(uiState.onboardStep<OB_STEPS.length-1){
        uiState.onboardStep++;render();
      }
      break;
    case 'ob-prev':
      if(uiState.onboardStep>0){uiState.onboardStep--;render();}
      break;
    case 'ob-skip':
      completeOnboarding();
      break;
    case 'ob-template':{
      var t=TEMPLATES[Number(btn.dataset.idx)];
      if(t){addHabit(habitFromTemplate(t));}
      completeOnboarding();
      break;}
    case 'replay-onboarding':
      uiState.showOnboarding=true;
      uiState.onboardStep=0;
      render();
      break;

    /* —— 应用 —— */
    case 'tab':
      uiState.tab=btn.dataset.tab;uiState.expanded={};render();break;
    case 'add-template':{
      var t2=TEMPLATES[Number(btn.dataset.idx)];
      if(t2)addHabit(habitFromTemplate(t2));
      break;}
    case 'checkin':{
      var h=state.habits.filter(function(x){return x.id===id;})[0];
      if(!h)break;
      if(h.kind==='quantitative'||h.kind==='checklist'){uiState.expanded[id]=true;render();}
      else checkIn(id,{status:'done',value:h.targetValue});
      break;}
    case 'undo':undoCheckIn(id);break;
    case 'struggle':checkIn(id,{status:'struggle',value:0});break;
    case 'leave':checkIn(id,{status:'leave',value:0});break;
    case 'expand':uiState.expanded[id]=true;render();break;
    case 'collapse':uiState.expanded[id]=false;render();break;
    case 'save':{
      var h2=state.habits.filter(function(x){return x.id===id;})[0];
      if(!h2)break;
      var noteEl=document.getElementById('note-'+id);
      var note=noteEl?noteEl.value:'';
      if(h2.kind==='quantitative'){
        var valEl=document.getElementById('val-'+id);
        var val=valEl?Number(valEl.value)||0:0;
        checkIn(id,{status:val>=h2.targetValue?'done':'partial',value:val,note:note||undefined});
      }else if(h2.kind==='checklist'){
        var checks=document.querySelectorAll('input[data-cl-item][data-id="'+id+'"]');
        var n=0;checks.forEach(function(c){if(c.checked)n++;});
        checkIn(id,{status:n>=h2.checklist.length?'done':'partial',value:n,note:note||undefined});
      }else checkIn(id,{status:'done',value:h2.targetValue,note:note||undefined});
      uiState.expanded[id]=false;break;}
    case 'apply-proposal':{
      var p=generateProposals(state.habits,state.checkins,todayISO()).filter(function(x){return x.key===key;})[0];
      if(p)applyProposal(id,p.patch,key);
      break;}
    case 'dismiss-proposal':dismissProposal(id,key);break;
    case 'open-form':openHabitForm(null);break;
    case 'edit-habit':{
      var h3=state.habits.filter(function(x){return x.id===id;})[0];
      if(h3)openHabitForm(h3);break;}
    case 'archive-habit':archiveHabit(id);break;
    case 'restore-habit':restoreHabit(id);break;
    case 'delete-habit':{
      var h4=state.habits.filter(function(x){return x.id===id;})[0];
      if(h4&&confirm('删除「'+h4.name+'」及其全部记录？'))deleteHabit(id);
      break;}
    case 'toggle-notif':toggleNotifications();break;
    case 'export':{
      var blob=new Blob([exportData()],{type:'application/json'});
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');a.href=url;
      a.download='habitstep-'+new Date().toISOString().slice(0,10)+'.json';a.click();
      URL.revokeObjectURL(url);break;}
    case 'import-btn':document.getElementById('import-file').click();break;
    case 'reset':
      if(confirm('将删除全部习惯、打卡记录与成就，且不可恢复。确定吗？'))resetAll();
      break;
    /* —— v5 扩展 —— */
    case 'toggle-mode':
      if(id&&btn.dataset.mode){setHabitMode(id,btn.dataset.mode);}break;
    case 'set-domain':
      if(id&&btn.dataset.domain){setHabitDomain(id,btn.dataset.domain);}break;
    case 'set-intent':
      if(id){uiState.editIntentId=id;var hname=(state.habits.filter(function(h){return h.id===id;})[0]||{}).name||'';var v=prompt('为「'+hname+'」写一句你的意图：','');if(v!=null){updateHabit(id,{intent:v});}}break;
    case 'toggle-mvp':
      if(id){var h5=state.habits.filter(function(x){return x.id===id;})[0];if(h5){var cur=h5.minimumViable||{};updateHabit(id,{minimumViable:Object.assign({value:null,unit:'',description:'',enabled:false},cur,{enabled:!cur.enabled})});}}break;
    case 'archive-habit':{
      var h6=state.habits.filter(function(x){return x.id===id;})[0];if(!h6)break;
      var reason=prompt('为什么要归档「'+h6.name+'」？（选填，用来留下经验教训）','');
      var lesson=prompt('从这个习惯里你学到了什么？或希望下一次做它时怎么调整？','');
      archiveWithStory(id,reason||'',lesson||'');
      break;}
    case 'restart-habit':
      if(id){restartHabitFromArchive(id);}break;
    case 'tab-domains':uiState.tab='domains';uiState.expanded={};render();break;
    case 'tab-review':uiState.tab='review';uiState.expanded={};render();break;
    case 'open-domain-detail':
      if(btn.dataset.domainId){uiState.domainDetailId=btn.dataset.domainId;render();}break;
    case 'close-domain-detail':uiState.domainDetailId=null;render();break;
  }
});

document.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.action){
    var a=el.dataset.action;
    if(a==='set-theme')updateSettings({theme:el.value});
    else if(a==='set-window')updateSettings({consistencyWindow:Number(el.value)});
    else if(a==='set-quiet-from')updateSettings({dontDisturbFrom:el.value});
    else if(a==='set-quiet-to')updateSettings({dontDisturbTo:el.value});
  }
  if(el.id==='import-file'&&el.files&&el.files[0]){
    var reader=new FileReader();
    reader.onload=function(){
      var ok=importData(String(reader.result));
      alert(ok?'导入成功':'导入失败：文件格式不正确');
    };
    reader.readAsText(el.files[0]);el.value='';
  }
});

function notificationTick(){
  if(!state.settings.notificationsEnabled)return;
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  var now=new Date();
  var sentKey='habitstep-notified-'+todayISO();
  var sent=[];
  try{sent=JSON.parse(localStorage.getItem(sentKey)||'[]');}catch(e){sent=[];}
  var sentSet={};sent.forEach(function(x){sentSet[x]=1;});
  state.habits.forEach(function(habit){
    var d=decideNotification(habit,state.checkins,now,state.settings.dontDisturbFrom,state.settings.dontDisturbTo);
    if(d.action==='downgrade-mode'){
      habit.notifState.mode='reduced';habit.notifState.lastReducedAt=now.toISOString();saveState();
      try{new Notification('微步 · 提醒已调低',{body:'你最近常常在提醒前就完成了「'+habit.name+'」。我已把它改成每周一次摘要，剩下的交给你自己。',tag:'habitstep-'+habit.id});}catch(e){}
      return;
    }
    if(d.action!=='send')return;
    if(sentSet[habit.id])return;
    try{new Notification('微步 · '+habit.name,{body:d.reason==='每周摘要'?'本周摘要：想看一眼这周完成得怎么样吗？':'到时间了。做到最小版本也算数。',tag:'habitstep-'+habit.id});}catch(e){}
    sentSet[habit.id]=1;
    localStorage.setItem(sentKey,JSON.stringify(Object.keys(sentSet)));
  });
}

/* ============================================================
   17. v5 —— 节奏指纹 computeRhythm
   ============================================================ */
function computeRhythm(habit,checkins,endISO){
  endISO=endISO||todayISO();
  var days=90;
  var windowDays=lastNDays(days,endISO);
  var weekdayPattern=[0,0,0,0,0,0,0]; // 每天的尝试次数
  var weekdayDone=[0,0,0,0,0,0,0];
  var byDate={};
  var i,c,wd;
  for(i=0;i<checkins.length;i++)if(checkins[i].habitId===habit.id)byDate[checkins[i].date]=checkins[i];
  var morning=0,afternoon=0,evening=0,totalWithTime=0;
  var totalDone=0,totalTry=0;
  // 关键词统计
  var kwCount={};
  var notes=[],note;
  for(i=0;i<windowDays.length;i++){
    var d=windowDays[i];
    if(d>endISO)continue;
    c=byDate[d];wd=weekdayOf(d);
    // 是否是 scheduled day：不管频率是什么，这里只计尝试
    if(c){
      totalTry++;weekdayPattern[wd]++;
      if(isCompleted(c,habit)){totalDone++;weekdayDone[wd]++;}
      if(c.createdAt){
        try{
          var hr=new Date(c.createdAt).getHours();
          if(hr>=5&&hr<12)morning++;else if(hr>=12&&hr<18)afternoon++;else evening++;
          totalWithTime++;
        }catch(e){}
      }
      if(c.note&&c.note.trim()){
        notes.push(c.note);
        // 简单中文分词：按标点和空格切，同时整体串进 kwCount（2-6字滑窗）
        for(var l=2;l<=6;l++){
          var s=c.note;
          for(var k=0;k<=s.length-l;k++){
            var piece=s.slice(k,k+l);
            if(/^[\u4e00-\u9fa5]+$/.test(piece)){
              kwCount[piece]=(kwCount[piece]||0)+1;
            }
          }
        }
      }
    }
  }
  // 自然频率
  var weeks=Math.max(1,Math.floor(days/7));
  var naturalFreq=+(totalDone/weeks).toFixed(1);
  // hardest weekday
  var hardestWd=0,hardestRatio=999;
  for(wd=0;wd<7;wd++){
    if(weekdayPattern[wd]===0)continue;
    var r=weekdayDone[wd]/weekdayPattern[wd];
    if(r<hardestRatio){hardestRatio=r;hardestWd=wd;}
  }
  // time of day 比率
  var timeOfDay=null;
  if(totalWithTime>=5){
    timeOfDay={
      morning:+(morning/totalWithTime).toFixed(2),
      afternoon:+(afternoon/totalWithTime).toFixed(2),
      evening:+(evening/totalWithTime).toFixed(2)
    };
  }
  // 关键词 top 3
  var noteKeywords=Object.keys(kwCount).sort(function(a,b){return kwCount[b]-kwCount[a];}).slice(0,3).map(function(k){return k;});
  return {
    habitId:habit.id,totalDone:totalDone,totalTry:totalTry,days:days,
    weekdayPattern:weekdayPattern,weekdayDone:weekdayDone,
    naturalFreq:naturalFreq,hardestWeekday:hardestWd,
    timeOfDay:timeOfDay,noteKeywords:noteKeywords,
    notes:notes
  };
}

/* ============================================================
   18. v5 —— 渲染节奏摘要（今日页）
   ============================================================ */
function renderRhythmSummary(active,todayISO){
  if(!active||active.length===0)return '';
  var rows=active.slice(0,3).map(function(h){
    var r=computeRhythm(h,state.checkins,todayISO);
    var line='过去 90 天，你自然地一周做 '+r.naturalFreq+' 次。';
    if(r.totalDone>0){
      line+='星期'+WEEK_NAMES[r.hardestWeekday]+'通常更难一些。';
    }
    var topKw=r.noteKeywords&&r.noteKeywords[0]?' 最近你提到「'+r.noteKeywords[0]+'」。':'';
    return '<div class="rhythm-hint">'+h.icon+' '+esc(h.name)+'：'+line+topKw+'</div>';
  }).join('');
  return rows;
}

function archiveWithStory(habitId,reason,lesson){
  var h=state.habits.find(function(x){return x.id===habitId;});
  if(!h)return;
  h.status='archived';
  // 保留一份归档记录（habitId 指向原习惯）
  state.archiveEntries.push({
    id:uid(),
    habitId:habitId,
    habitName:h.name,
    habitIcon:h.icon,
    habitSnapshot:JSON.parse(JSON.stringify({name:h.name,icon:h.icon,kind:h.kind,targetValue:h.targetValue,unit:h.unit,
      frequency:h.frequency,checklist:h.checklist,domainId:h.domainId,intent:h.intent})),
    reason:reason||'',lesson:lesson||'',archivedAt:new Date().toISOString()
  });
  saveState();render();
}
function restartHabitFromArchive(habitId){
  var oldH=state.habits.find(function(x){return x.id===habitId;});
  if(!oldH)return;
  var entry=state.archiveEntries.filter(function(e){return e.habitId===habitId;}).sort(function(a,b){return a.archivedAt<b.archivedAt?1:-1;})[0];
  var snap=entry&&entry.habitSnapshot?entry.habitSnapshot:{name:oldH.name,icon:oldH.icon,kind:oldH.kind,targetValue:oldH.targetValue,unit:oldH.unit,
    frequency:oldH.frequency,checklist:oldH.checklist,domainId:oldH.domainId,intent:oldH.intent};
  var newHabit=Object.assign(DEFAULT_HABIT_FIELDS({}),{
    id:uid(),name:snap.name,icon:snap.icon,color:oldH.color||'#0d9488',kind:snap.kind,targetValue:snap.targetValue,unit:snap.unit,
    frequency:snap.frequency||{kind:'daily'},checklist:snap.checklist||[],startDate:todayISO(),allowMakeup:true,status:'active',
    createdAt:new Date().toISOString(),
    reminder:{enabled:false,time:'20:00'},
    notifState:{mode:'active',preReminderStreak:0},
    adaptive:{baseTargetValue:snap.targetValue,baseFrequency:snap.frequency,declinedKeys:[]},
    domainId:snap.domainId||'mind',mode:'recovery',intent:snap.intent||(entry&&entry.lesson?('重新开始：'+entry.lesson):''),
    minimumViable:{value:null,unit:'',description:'',enabled:false}
  });
  addHabit(newHabit);
}

/* ============================================================
   21. v5 —— generateWeeklyNarrative / generateQuarterNarrative
   ============================================================ */
function generateWeeklyNarrative(habits,checkins,nowISO){
  var todayISO=nowISO||window.todayISO();
  var start=addDays(todayISO,-6);
  var prevStart=addDays(start,-7);
  var active=habits.filter(function(h){return h.status==='active';});
  if(active.length===0)return '';
  // 领域分组
  var domainBuckets={};
  DOMAINS.forEach(function(d){domainBuckets[d.id]={habits:[],done:0,expected:0};});
  var lines=[],specialNotes=[];
  active.forEach(function(h){
    var cur=computeConsistency(h,checkins,7,todayISO);
    var prev=computeConsistency(h,checkins,7,addDays(start,-1));
    var delta=cur.ratio-prev.ratio;
    var trend=delta>=0.1?'上升':delta<=-0.1?'下降':'稳定';
    lines.push('「'+h.name+'」本周 '+trend+'（'+cur.completedDays+'/'+Math.round(cur.expected)+'，上周 '+prev.completedDays+'/'+Math.round(prev.expected)+'）。');
    domainBuckets[h.domainId||'mind'].done+=cur.completedDays;
    domainBuckets[h.domainId||'mind'].expected+=cur.expected;
    // 特殊备注
    var weekNotes=checkins.filter(function(c){
      return c.habitId===h.id&&c.date>=start&&c.date<=todayISO&&c.note&&c.note.trim();
    });
    weekNotes.forEach(function(c){
      if(c.note.trim().length>=2)specialNotes.push('· '+WEEK_FULL[weekdayOf(c.date)]+'「'+h.name+'」：“'+c.note.trim().slice(0,40)+'”');
    });
  });
  var domainLines=[];
  DOMAINS.forEach(function(d){
    var b=domainBuckets[d.id];
    if(b.expected===0)return;
    var ratio=b.done/Math.max(1,Math.round(b.expected));
    var desc=ratio>=0.8?'稳固':ratio>=0.5?'在进行':'较薄弱';
    domainLines.push(d.icon+d.name+' '+desc+'（'+Math.round(ratio*100)+'%）');
  });
  // 输出
  var out='本周概览\n\n';
  out+=active.length>1?'你一共养着 '+active.length+' 个习惯，它们各自走着不同的节奏。\n\n':'你正在养着 1 个习惯，它走得怎样？\n\n';
  out+='各个习惯\n';
  lines.forEach(function(l){out+='· '+l+'\n';});
  out+='\n领域平衡\n';
  if(domainLines.length>0)domainLines.forEach(function(l){out+='· '+l+'\n';});
  if(specialNotes.length>0){
    out+='\n这周留下的备注\n';
    specialNotes.slice(0,6).forEach(function(n){out+=n+'\n';});
  }
  return out;
}

function generateQuarterNarrative(habits,checkins,nowISO){
  var todayISO=nowISO||window.todayISO();
  // 取过去 90 天
  var active=habits.filter(function(h){return h.status==='active'||h.status==='archived';});
  if(active.length===0)return '';
  var out='过去 90 天\n\n';
  out+='身体、心智、技艺、联结、富足 —— 五个领域在慢慢长。\n\n';
  active.forEach(function(h){
    var r=computeRhythm(h,checkins,todayISO);
    var cons=computeConsistency(h,checkins,90,todayISO);
    var streak=computeStreak(h,checkins,todayISO);
    var phase;
    if(streak.best>=30||cons.ratio>=0.8)phase='正在扎根';
    else if(cons.ratio>=0.5)phase='在长叶';
    else if(cons.ratio>=0.25)phase='刚冒头';
    else phase='还在土里';
    var growth='';
    if(h.status==='archived')growth='但你选择让它休息 —— 也许是换一种方式继续。';
    else if(phase==='刚冒头')growth='先别急，让它先活下来。';
    else if(phase==='还在土里')growth='没长出来也没关系，等下一季。';
    out+='「'+h.name+'」'+(h.status==='archived'?'（已归档）':'')+'—— '+phase+'。\n';
    out+='· 90 天里自然地一周 '+r.naturalFreq+' 次，共 '+cons.completedDays+'/'+Math.round(cons.expected)+'。\n';
    if(r.totalDone>0)out+='· 最难的是周'+WEEK_NAMES[r.hardestWeekday]+'，试试换个角度和它相处。\n';
    if(growth)out+='· '+growth+'\n';
    out+='\n';
  });
  out+='生老病死 —— 习惯也会。有的扎根了，有的换个样子回来，有的就这样。\n';
  out+='重要的是，你在看。\n';
  return out;
}

/* ============================================================
   22. v5 —— renderDomains / renderReview
   ============================================================ */
function renderDomains(){
  var active=state.habits.filter(function(h){return h.status==='active';});
  var detailId=uiState.domainDetailId;
  var html='';
  // 领域详情优先
  if(detailId){
    var d=DOMAIN_MAP[detailId];
    if(d){
      var dHabits=active.filter(function(h){return h.domainId===detailId;});
      var archivedD=state.habits.filter(function(h){return h.status==='archived'&&h.domainId===detailId;});
      html+='<div class="domain-detail"><div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">'+
        '<button class="btn btn-ghost btn-sm" data-action="close-domain-detail">← 返回</button>'+
        '<span style="font-size:28px">'+d.icon+'</span>'+
        '<div><div style="font-size:16px;font-weight:600">'+d.name+'</div><div style="font-size:12px;color:var(--light)">'+esc(d.desc)+'</div></div>'+
      '</div></div>';
      if(dHabits.length===0&&archivedD.length===0){
        html+='<div class="empty-msg">这个领域还没有习惯。去「习惯」tab 新建一个，选上所属领域吧。</div>';
      }else{
        dHabits.forEach(function(h){html+=renderHabitCard(h);});
        if(archivedD.length>0){
          html+='<div class="card" style="opacity:.8"><h3 style="font-size:13px;font-weight:500;color:var(--light);margin-bottom:6px">已归档</h3>'+
            archivedD.map(function(h){return '<div style="font-size:13px;padding:6px 0">'+h.icon+' '+esc(h.name)+'</div>';}).join('')+'</div>';
        }
      }
      return html;
    }
  }
  // 默认：5 个领域卡片
  html+='<div class="list-header"><h2>五个领域 · 整体看一眼</h2></div>';
  DOMAINS.forEach(function(d){
    var inDomain=active.filter(function(h){return h.domainId===d.id;});
    var archivedIn=state.habits.filter(function(h){return h.status==='archived'&&h.domainId===d.id;});
    var avgRatio=0;
    if(inDomain.length>0){
      var sum=0;
      inDomain.forEach(function(h){sum+=computeConsistency(h,state.checkins,30,todayISO()).ratio;});
      avgRatio=sum/inDomain.length;
    }
    html+='<button class="domain-card" data-action="open-domain-detail" data-domain-id="'+d.id+'">'+
      '<div class="domain-dot" style="background:'+d.color+'20">'+d.icon+'</div>'+
      '<div class="domain-meta">'+
        '<div class="nm">'+d.name+'</div>'+
        '<div class="dt">'+esc(d.desc)+'</div>'+
        '<div class="bar-track" style="margin-top:6px"><div class="bar-fill" style="width:'+Math.round(avgRatio*100)+'%"></div></div>'+
        '<div style="font-size:11px;color:var(--light);margin-top:4px">'+inDomain.length+' 个活跃 · 近 30 天 '+Math.round(avgRatio*100)+'%'+(archivedIn.length>0?' · '+archivedIn.length+' 个归档':'')+'</div>'+
      '</div>'+
    '</button>';
  });
  html+='<div class="card" style="margin-top:14px"><p class="hint">领域是「视角」而不是互斥分类 —— 一个习惯可以同时服务多个领域。这里只做简单归属，帮你看见整体平衡。</p></div>';
  return html;
}

function renderReview(){
  var html='';
  var today=todayISO();
  var ws=weekStartISO(today,1);
  var we=addDays(ws,6);
  html+='<div class="list-header"><h2>回顾 · '+formatCN(ws)+' — '+formatCN(today)+'</h2></div>';
  html+='<div class="narrative"><h3>这周</h3>'+esc(generateWeeklyNarrative(state.habits,state.checkins,today))+'</div>';
  // 月度切换
  var lastMonthStart=addDays(today,-29);
  html+='<div class="narrative" style="margin-top:12px"><h3>过去 30 天</h3>'+esc(generateWeeklyNarrative(state.habits,state.checkins,lastMonthStart))+'</div>';
  // 季度
  html+='<div class="narrative" style="margin-top:12px"><h3>过去 90 天 · 生老病死</h3>'+esc(generateQuarterNarrative(state.habits,state.checkins,today))+'</div>';
  // 习惯档案
  var archived=state.habits.filter(function(h){return h.status==='archived';});
  if(archived.length>0){
    html+='<div class="card" style="margin-top:14px"><h3 style="font-size:14px;font-weight:500;margin-bottom:8px">习惯档案（'+archived.length+'）</h3>'+
      archived.slice().sort(function(a,b){
        var ea=state.archiveEntries.filter(function(e){return e.habitId===a.id;}).sort(function(x,y){return x.archivedAt<y.archivedAt?1:-1;})[0];
        var eb=state.archiveEntries.filter(function(e){return e.habitId===b.id;}).sort(function(x,y){return x.archivedAt<y.archivedAt?1:-1;})[0];
        return (eb&&eb.archivedAt||'')>(ea&&ea.archivedAt||'')?1:-1;
      }).map(function(h){
        var entry=state.archiveEntries.filter(function(e){return e.habitId===h.id;}).sort(function(a,b){return a.archivedAt<b.archivedAt?1:-1;})[0];
        var timeStr=entry?formatCN(entry.archivedAt.slice(0,10))+' · '+entry.archivedAt.slice(11,16):'';
        return '<div class="archive-entry">'+
          '<div style="display:flex;align-items:center;justify-content:space-between">'+
            '<span style="font-size:14px;font-weight:500">'+h.icon+' '+esc(h.name)+'</span>'+
            '<button class="btn btn-ghost btn-sm" data-action="restart-habit" data-id="'+h.id+'">重启</button>'+
          '</div>'+
          (timeStr?'<div style="font-size:11px;color:var(--light);margin-top:2px">'+timeStr+'</div>':'')+
          (entry&&entry.reason?'<div class="quote">归档原因：'+esc(entry.reason)+'</div>':'')+
          (entry&&entry.lesson?'<div style="font-size:12px;color:var(--st-600);margin-top:4px">心得：'+esc(entry.lesson)+'</div>':'')+
        '</div>';
      }).join('')+'</div>';
  }
  // 成就墙（保留，方便回看）
  var sortedAch=state.achievements.slice().sort(function(a,b){return a.unlockedAt<b.unlockedAt?1:-1;});
  if(sortedAch.length>0){
    html+='<div class="card" style="margin-top:14px"><h3 style="font-size:14px;font-weight:500;margin-bottom:8px">成就墙（'+sortedAch.length+'）</h3>'+
      '<div class="achv-grid">'+sortedAch.map(function(a){
        var h=state.habits.filter(function(x){return x.id===a.habitId;})[0];
        return '<div class="achv-card"><div class="achv-icon">🏅</div><div>'+
          '<div class="achv-title">'+esc(a.title)+'</div>'+
          '<div class="achv-desc">'+esc(a.description)+'</div>'+
          '<div class="achv-date">'+(h?esc(h.icon+' '+h.name):'')+' · '+formatCN(a.unlockedAt.slice(0,10))+'</div></div></div>';
      }).join('')+'</div></div>';
  }
  return html;
}

/* ============================================================
   23. v5 —— 增强 generateProposals（基于 rhythm）
   ============================================================ */
(function(){
  var _orig=generateProposals;
  generateProposals=function(habits,checkins,today){
    var out=_orig(habits,checkins,today);
    // 基于 rhythm 的补充提议
    var active=habits.filter(function(h){return h.status==='active';});
    active.forEach(function(h){
      if(h.adaptive.lastProposalDate&&diffDays(h.adaptive.lastProposalDate,today)<14)return;
      var r=computeRhythm(h,checkins,today);
      // 难日常驻：提议拿掉那个 weekday
      if(h.frequency&&h.frequency.kind==='weekdays'&&h.frequency.weekdays&&h.frequency.weekdays.length>1){
        var wds=h.frequency.weekdays;
        // 如果 hardestWeekday 在 schedule 里并且过去 4 周那个 weekday 尝试/完成比 < 0.3
        var inSchedule=wds.indexOf(r.hardestWeekday)>=0;
        if(inSchedule){
          var wdMiss=0,wdTotal=0,i,d,chk;
          for(i=1;i<=28;i++){
            d=addDays(today,-i);
            if(weekdayOf(d)!==r.hardestWeekday)continue;
            if(wds.indexOf(weekdayOf(d))<0)continue;
            wdTotal++;
            chk=checkins.filter(function(x){return x.habitId===h.id&&x.date===d;})[0];
            if(!chk||!isCompleted(chk,h))wdMiss++;
          }
          if(wdTotal>=3&&wdMiss>=Math.max(2,wdTotal*0.6)){
            var refKey='rhythm-refreq:'+h.id+':'+r.hardestWeekday;
            if(h.adaptive.declinedKeys.indexOf(refKey)<0){
              out.push({
                key:refKey,habitId:h.id,title:'节奏观察',
                message:'你 '+WEEK_FULL[r.hardestWeekday]+' 很难做到「'+h.name+'」—— 过去 90 天这个日子的完成率明显更低。要不要先把它从目标里拿掉，让其他 6 天先稳稳的？',
                acceptLabel:'先拿掉'+WEEK_FULL[r.hardestWeekday],
                dismissLabel:'保留',
                patch:{frequency:{kind:'weekdays',weekdays:wds.filter(function(d){return d!==r.hardestWeekday;})}}
              });
            }
          }
        }
      }
    });
    return out.slice(0,3);
  };
})();
